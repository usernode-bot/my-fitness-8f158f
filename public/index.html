        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {

    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });

  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script>
    // Follow the platform's Light/Dark setting. Inside the app frame
    // prefers-color-scheme sees the OS, not the shell, so read the
    // resolved theme the bridge publishes and fall back to the OS
    // preference only when the app is open standalone.
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme)
          || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();

<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen antialiased">
  <div id="app"></div>

  <script>
  'use strict';

  // ---------------------------------------------------------------------
  // Plumbing
  // ---------------------------------------------------------------------

  const params = new URLSearchParams(window.location.search);
  const TOKEN = params.get('token') || '';
  const DEMO = params.get('demo') === '1';

  function apiUrl(path) {
    return path + (DEMO ? (path.includes('?') ? '&' : '?') + 'demo=1' : '');
  }

  async function api(path, options) {
    const opts = options || {};
    const res = await fetch(apiUrl(path), {
      method: opts.method || 'GET',
      headers: Object.assign(
        { 'Content-Type': 'application/json' },
        TOKEN ? { 'x-usernode-token': TOKEN } : {}
      ),
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok) {
      const err = new Error(data.error || ('Request failed (' + res.status + ')'));
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  const appEl = document.getElementById('app');

  const state = {
    booted: false,
    view: 'loading',          // loading | wizard | dashboard | log | add | signedout | bootError
    onboarded: false,
    profile: null,
    goal: null,
    targets: null,
    demo: false,
    day: null,
    meals: null,              // { groups, totals, count }
    water: null,              // { glasses, targetMl, glassMl, ml }
    daysToTarget: null,
    dashError: null,
    dashLoading: false,
    waterPending: false,
    waterError: null,
    mealError: null,
    wiz: null,                // wizard state, created on demand
    log: { tab: 'today', hist: null, histRange: null, loading: false, error: null },
    add: null,                // food search state, created on demand
    detail: null,             // open detail sheet state
    detailError: null,
    detailSaving: false,
    create: null,             // custom food form state
    logToast: null,
  };

  // ---------------------------------------------------------------------
  // Shared health math (mirrors calculations.js on the server; the values
  // the server returns after save are the authoritative ones).
  // ---------------------------------------------------------------------

  const ACTIVITY_FACTORS = {
    sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, very_active: 1.9,
  };
  const ACTIVITY_OPTIONS = [
    { value: 'sedentary', label: 'Sedentary', hint: 'Little or no exercise' },
    { value: 'light', label: 'Lightly active', hint: 'Exercise 1 to 3 days a week' },
    { value: 'moderate', label: 'Moderately active', hint: 'Exercise 3 to 5 days a week' },
    { value: 'active', label: 'Very active', hint: 'Exercise 6 or 7 days a week' },
    { value: 'very_active', label: 'Extremely active', hint: 'Physical job or twice daily training' },
  ];
  const GENDER_OPTIONS = [
    { value: 'male', label: 'Male' },
    { value: 'female', label: 'Female' },
    { value: 'other', label: 'Other' },
  ];
  const GOAL_OPTIONS = [
    { value: 'lose', label: 'Lose weight', hint: 'Aim for about half a kilo per week' },
    { value: 'maintain', label: 'Maintain weight', hint: 'Keep your current weight' },
    { value: 'gain', label: 'Gain weight', hint: 'Build up gradually' },
  ];
  const MEAL_LABELS = { breakfast: 'Breakfast', lunch: 'Lunch', dinner: 'Dinner', snack: 'Snack' };
  const MEAL_ORDER = ['breakfast', 'lunch', 'dinner', 'snack'];
  const MEAL_OPTIONS = MEAL_ORDER.map((k) => ({ value: k, label: MEAL_LABELS[k] }));

  const CALORIE_FLOOR = 1200;
  const MACRO_SPLITS = {
    lose: { protein: 40, carbs: 30, fat: 30 },
    maintain: { protein: 30, carbs: 40, fat: 30 },
    gain: { protein: 30, carbs: 45, fat: 25 },
  };

  function roundTo(value, step) { return Math.round(value / step) * step; }
  function round1(value) { return Math.round(value * 10) / 10; }

  function bmiCategory(bmi) {
    if (bmi < 18.5) return 'Underweight';
    if (bmi < 25) return 'Healthy';
    if (bmi < 30) return 'Overweight';
    return 'Obese';
  }

  function computeTargets(p, g) {
    const kg = Number(p.weight_kg), cm = Number(p.height_cm), age = Number(p.age);
    const bmi = round1(kg / Math.pow(cm / 100, 2));
    const offset = p.gender === 'male' ? 5 : p.gender === 'female' ? -161 : -78;
    const bmr = 10 * kg + 6.25 * cm - 5 * age + offset;
    const tdee = bmr * ACTIVITY_FACTORS[p.activity_level];
    const raw = g.goal_type === 'lose' ? tdee - 500 : g.goal_type === 'gain' ? tdee + 300 : tdee;
    const floored = raw < CALORIE_FLOOR;
    const calorieTarget = Math.max(CALORIE_FLOOR, roundTo(raw, 10));
    const split = MACRO_SPLITS[g.goal_type] || MACRO_SPLITS.maintain;
    return {
      bmi,
      bmiCategory: bmiCategory(bmi),
      bmr: Math.round(bmr),
      tdee: Math.round(tdee),
      calorieTarget,
      calorieFloorApplied: floored,
      proteinGrams: Math.round(calorieTarget * split.protein / 100 / 4),
      carbsGrams: Math.round(calorieTarget * split.carbs / 100 / 4),
      fatGrams: Math.round(calorieTarget * split.fat / 100 / 9),
      macroSplit: split,
      waterTargetMl: Math.min(4000, Math.max(1500, roundTo(kg * 35, 100))),
      glassMl: 250,
    };
  }

  // ---------------------------------------------------------------------
  // Router (hash based: #dashboard default, #profile the wizard, #log the
  // food log, #add the food search)
  // ---------------------------------------------------------------------

  function routeView() {
    const h = location.hash;
    if (h === '#profile') return 'wizard';
    if (h === '#log' || h.indexOf('#log/') === 0) return 'log';
    if (h === '#add') return 'add';
    return 'dashboard';
  }

  // The Week and Month tabs are URL-reachable (#log/week, #log/month) so a
  // shared link and the before/after shots land on the same tab.
  function logTabFromHash() {
    const h = location.hash;
    if (h === '#log/week') return 'week';
    if (h === '#log/month') return 'month';
    return 'today';
  }

  window.addEventListener('hashchange', () => {
    if (!state.booted) return;
    const view = routeView();
    if (view === 'wizard') {
      openWizard(state.onboarded);
    } else if (view === 'log') {
      enterLog();
    } else if (view === 'add') {
      enterAdd();
    } else if (state.onboarded) {
      state.view = 'dashboard';
      state.wiz = null;
      render();
      if (!state.meals) loadDashboard();
    }
  });

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------

  async function boot() {
    try {
      const data = await api('/api/profile');
      state.onboarded = !!data.onboarded;
      state.demo = !!data.demo;
      if (data.onboarded) {
        state.profile = data.profile;
        state.goal = data.goal;
        state.targets = data.targets;
        const view = routeView();
        if (view === 'wizard') openWizard(true);
        else if (view === 'log') enterLog();
        else if (view === 'add') enterAdd();
        else { state.view = 'dashboard'; render(); loadDashboard(); }
      } else {
        openWizard(false);
      }
    } catch (err) {
      if (err.status === 401) { state.view = 'signedout'; render(); }
      else { state.bootError = err.message || 'Could not load the app'; state.view = 'bootError'; render(); }
    }
    state.booted = true;
  }

  function openWizard(editing) {
    state.view = 'wizard';
    state.onboarded = !!editing;
    const p = editing && state.profile ? state.profile : null;
    const g = editing && state.goal ? state.goal : null;
    state.wiz = {
      editing: !!editing,
      step: 1,
      saving: false,
      serverError: null,
      errors: {},
      data: {
        name: p ? p.name : '',
        age: p ? p.age : '',
        gender: p ? p.gender : '',
        email: p && p.email ? p.email : '',
        height_cm: p ? p.height_cm : '',
        weight_kg: p ? p.weight_kg : '',
        activity_level: p ? p.activity_level : '',
        goal_type: g ? g.goal_type : '',
        target_weight_kg: g && g.target_weight_kg != null ? g.target_weight_kg : '',
        target_date: g && g.target_date ? g.target_date : '',
      },
    };
    render();
  }

  // ---------------------------------------------------------------------
  // Small building blocks
  // ---------------------------------------------------------------------

  const iconDashboard = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>';
  const iconProfile = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path stroke-linecap="round" d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
  const iconLog = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10"/></svg>';
  const iconWater = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3s6 7.2 6 11.4A6 6 0 0 1 6 14.4C6 10.2 12 3 12 3Z"/></svg>';
  const iconStar = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m12 3 2.7 5.6 6.1.8-4.4 4.2 1.1 6-5.5-2.9-5.5 2.9 1.1-6L3.2 9.4l6.1-.8L12 3Z"/></svg>';
  const iconStarFilled = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m12 3 2.7 5.6 6.1.8-4.4 4.2 1.1 6-5.5-2.9-5.5 2.9 1.1-6L3.2 9.4l6.1-.8L12 3Z"/></svg>';
  const iconBack = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-5 h-5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/></svg>';

  function card(inner, extraClass) {
    return '<section class="rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 p-5 '
      + (extraClass || '') + '">' + inner + '</section>';
  }

  function cardTitle(text, sub) {
    return '<div class="flex items-baseline justify-between gap-2 mb-4">'
      + '<h2 class="text-sm font-semibold uppercase tracking-wide text-zinc-500">' + text + '</h2>'
      + (sub ? '<span class="text-xs text-zinc-500">' + sub + '</span>' : '')
      + '</div>';
  }

  function errorBox(message, retryLabel) {
    return '<div class="rounded-xl border border-red-300 dark:border-red-900 bg-red-50 dark:bg-red-950/40 p-4 text-sm text-red-700 dark:text-red-300 flex items-center justify-between gap-3">'
      + '<span>' + esc(message) + '</span>'
      + '<button data-action="retry" class="shrink-0 min-h-[44px] px-4 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-500 transition-colors">' + (retryLabel || 'Retry') + '</button>'
      + '</div>';
  }

  function noticeBox(message) {
    return '<div class="rounded-xl border border-amber-300 dark:border-amber-900 bg-amber-50 dark:bg-amber-950/40 p-3 text-sm text-amber-800 dark:text-amber-200">'
      + esc(message) + '</div>';
  }

  function field(labelHtml, inputHtml, errorText) {
    return '<label class="block mb-4">'
      + '<span class="block text-sm font-medium mb-1.5">' + labelHtml + '</span>'
      + inputHtml
      + (errorText ? '<span class="block text-sm text-red-600 dark:text-red-400 mt-1">' + esc(errorText) + '</span>' : '')
      + '</label>';
  }

  const inputClass = 'w-full min-h-[44px] rounded-xl border bg-white dark:bg-zinc-950 px-3.5 text-base '
    + 'border-zinc-300 dark:border-zinc-700 focus:outline-none focus:ring-2 focus:ring-primary-600 focus:border-primary-600';

  function textInput(name, attrs, value) {
    return '<input name="' + name + '" ' + attrs + ' value="' + esc(value == null ? '' : value) + '" class="' + inputClass + '">';
  }

  function optionRow(group, opt, checked, hint) {
    return '<label class="flex items-center gap-3 px-4 min-h-[44px] py-2.5 cursor-pointer">'
      + '<input type="radio" name="' + group + '" value="' + opt.value + '" ' + (checked ? 'checked' : '')
      + ' class="w-5 h-5 accent-primary-600 shrink-0">'
      + '<span class="flex-1"><span class="block text-sm font-medium">' + esc(opt.label) + '</span>'
      + (hint ? '<span class="block text-xs text-zinc-500">' + esc(hint) + '</span>' : '')
      + '</span></label>';
  }

  function optionGroup(group, options, selected, hints) {
    return '<div class="rounded-xl border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 divide-y divide-zinc-200 dark:divide-zinc-800 overflow-hidden">'
      + options.map((o) => optionRow(group, o, o.value === selected, hints ? o.hint : null)).join('')
      + '</div>';
  }

  function primaryButton(action, label, extraClass, attrs) {
    return '<button data-action="' + action + '" ' + (attrs || '') + ' class="min-h-[44px] rounded-xl bg-primary-600 hover:bg-primary-500 text-white font-semibold shadow-sm transition-colors disabled:opacity-60 '
      + (extraClass || '') + '">' + label + '</button>';
  }

  function skeletonBlock() {
    return card('<div class="animate-pulse space-y-3"><div class="h-3 rounded bg-zinc-200 dark:bg-zinc-800"></div><div class="h-3 rounded bg-zinc-200 dark:bg-zinc-800 w-2/3"></div><div class="h-3 rounded bg-zinc-200 dark:bg-zinc-800 w-1/2"></div></div>');
  }

  // ---------------------------------------------------------------------
  // Wizard
  // ---------------------------------------------------------------------

  function validateStep(step, d) {
    const errors = {};
    if (step === 1) {
      if (!d.name || !d.name.trim()) errors.name = 'Enter your name';
      else if (d.name.trim().length > 100) errors.name = 'Name must be 100 characters or fewer';
      const age = Number(d.age);
      if (!Number.isInteger(age) || age < 13 || age > 100) errors.age = 'Enter an age between 13 and 100';
      if (!d.gender) errors.gender = 'Choose a gender';
      if (d.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) errors.email = 'Enter a valid email address';
    }
    if (step === 2) {
      const h = Number(d.height_cm);
      if (!Number.isFinite(h) || h < 100 || h > 250) errors.height_cm = 'Enter a height between 100 and 250 cm';
      const wgt = Number(d.weight_kg);
      if (!Number.isFinite(wgt) || wgt < 30 || wgt > 300) errors.weight_kg = 'Enter a weight between 30 and 300 kg';
      if (!d.activity_level) errors.activity_level = 'Choose an activity level';
    }
    if (step === 3) {
      if (!d.goal_type) errors.goal_type = 'Choose a goal';
      if (d.goal_type === 'lose' || d.goal_type === 'gain') {
        const t = Number(d.target_weight_kg);
        if (!Number.isFinite(t) || t < 30 || t > 300) errors.target_weight_kg = 'Enter a target weight between 30 and 300 kg';
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d.target_date || '')) errors.target_date = 'Choose a target date';
        else {
          const day = new Date(d.target_date + 'T00:00:00');
          const tomorrow = new Date(); tomorrow.setHours(0, 0, 0, 0); tomorrow.setDate(tomorrow.getDate() + 1);
          if (Number.isNaN(day.getTime()) || day < tomorrow) errors.target_date = 'Choose a date in the future';
        }
      }
    }
    return errors;
  }

  function planRow(term, value) {
    return '<div class="flex items-baseline justify-between gap-3 px-4 py-2.5">'
      + '<dt class="text-sm text-zinc-500">' + term + '</dt>'
      + '<dd class="text-sm font-semibold text-right">' + value + '</dd>'
      + '</div>';
  }

  function wizardHtml() {
    const w = state.wiz;
    const stepTitles = ['About you', 'Body and activity', 'Your goal', 'Your plan'];

    const stepsBar = '<div class="mb-6">'
      + '<div class="flex gap-1.5 mb-2">'
      + [1, 2, 3, 4].map((s) =>
          '<span class="h-1.5 flex-1 rounded-full ' + (s <= w.step ? 'bg-primary-600' : 'bg-zinc-200 dark:bg-zinc-800') + '"></span>').join('')
      + '</div>'
      + '<p class="text-sm text-zinc-500">Step ' + w.step + ' of 4 · ' + esc(stepTitles[w.step - 1]) + '</p>'
      + '</div>';

    let body = '';
    const errorSummary = w.serverError
      ? '<div class="rounded-xl border border-red-300 dark:border-red-900 bg-red-50 dark:bg-red-950/40 p-3 mb-4 text-sm text-red-700 dark:text-red-300">' + esc(w.serverError) + '</div>'
      : '';

    if (w.step === 1) {
      body =
        field('Name', textInput('name', 'type="text" autocomplete="name" maxlength="100" placeholder="Your name"', w.data.name), w.errors.name)
        + field('Age', textInput('age', 'type="number" inputmode="numeric" min="13" max="100" placeholder="Years"', w.data.age), w.errors.age)
        + '<div class="mb-4"><span class="block text-sm font-medium mb-1.5">Gender</span>'
        + optionGroup('gender', GENDER_OPTIONS, w.data.gender, false)
        + (w.errors.gender ? '<span class="block text-sm text-red-600 dark:text-red-400 mt-1">' + esc(w.errors.gender) + '</span>' : '')
        + '</div>'
        + field('Email <span class="font-normal text-zinc-500">(optional)</span>', textInput('email', 'type="email" autocomplete="email" placeholder="you@example.com"', w.data.email), w.errors.email);
    }

    if (w.step === 2) {
      body =
        field('Height (cm)', textInput('height_cm', 'type="number" inputmode="decimal" min="100" max="250" step="0.1" placeholder="cm"', w.data.height_cm), w.errors.height_cm)
        + field('Weight (kg)', textInput('weight_kg', 'type="number" inputmode="decimal" min="30" max="300" step="0.1" placeholder="kg"', w.data.weight_kg), w.errors.weight_kg)
        + '<div class="mb-1"><span class="block text-sm font-medium mb-1.5">Activity level</span>'
        + optionGroup('activity_level', ACTIVITY_OPTIONS, w.data.activity_level, true)
        + (w.errors.activity_level ? '<span class="block text-sm text-red-600 dark:text-red-400 mt-1">' + esc(w.errors.activity_level) + '</span>' : '')
        + '</div>';
    }

    if (w.step === 3) {
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
      const minDate = tomorrow.getFullYear() + '-' + String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' + String(tomorrow.getDate()).padStart(2, '0');
      const needsTarget = w.data.goal_type === 'lose' || w.data.goal_type === 'gain';
      body =
        '<div class="mb-4"><span class="block text-sm font-medium mb-1.5">Goal</span>'
        + optionGroup('goal_type', GOAL_OPTIONS, w.data.goal_type, true)
        + (w.errors.goal_type ? '<span class="block text-sm text-red-600 dark:text-red-400 mt-1">' + esc(w.errors.goal_type) + '</span>' : '')
        + '</div>'
        + '<div id="goal-target-fields"' + (needsTarget ? '' : ' class="hidden"') + '>'
        + field('Target weight (kg)', textInput('target_weight_kg', 'type="number" inputmode="decimal" min="30" max="300" step="0.1" placeholder="kg"', w.data.target_weight_kg), w.errors.target_weight_kg)
        + field('Target date', textInput('target_date', 'type="date" min="' + minDate + '"', w.data.target_date), w.errors.target_date)
        + '</div>';
    }

    if (w.step === 4) {
      const t = computeTargets(w.data, { goal_type: w.data.goal_type || 'maintain' });
      const needsTarget = w.data.goal_type === 'lose' || w.data.goal_type === 'gain';
      body =
        '<dl class="divide-y divide-zinc-200 dark:divide-zinc-800 rounded-xl border border-zinc-200 dark:border-zinc-800 overflow-hidden mb-4">'
        + planRow('BMI', t.bmi + ' · ' + t.bmiCategory)
        + planRow('BMR', t.bmr + ' kcal')
        + planRow('Daily burn (TDEE)', t.tdee + ' kcal')
        + planRow('Calorie target', t.calorieTarget + ' kcal' + (t.calorieFloorApplied ? ' <span class="text-xs text-zinc-500">(kept at 1200 for safety)</span>' : ''))
        + planRow('Protein', t.proteinGrams + ' g (' + t.macroSplit.protein + '%)')
        + planRow('Carbs', t.carbsGrams + ' g (' + t.macroSplit.carbs + '%)')
        + planRow('Fat', t.fatGrams + ' g (' + t.macroSplit.fat + '%)')
        + planRow('Water', (t.waterTargetMl / 1000).toFixed(1) + ' L per day')
        + (needsTarget ? planRow('Target weight', esc(w.data.target_weight_kg) + ' kg') : '')
        + (needsTarget ? planRow('Target date', esc(w.data.target_date)) : '')
        + '</dl>'
        + '<p class="text-xs text-zinc-500">These numbers are estimates from the Mifflin-St Jeor formula. You can change your plan any time.</p>';
    }

    const primaryLabel = w.step < 4 ? 'Continue' : (w.editing ? 'Save my plan' : 'Start my plan');
    const actions =
      '<div class="flex gap-3 mt-6">'
      + (w.step > 1 ? '<button type="button" data-action="wiz-back" class="min-h-[44px] px-5 rounded-xl border border-zinc-300 dark:border-zinc-700 font-semibold hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">Back</button>' : '')
      + '<button type="submit" ' + (w.saving ? 'disabled' : '') + ' class="flex-1 min-h-[44px] rounded-xl bg-primary-600 hover:bg-primary-500 text-white font-semibold shadow-sm transition-colors disabled:opacity-60">'
      + (w.saving ? 'Saving…' : primaryLabel) + '</button>'
      + '</div>';

    return '<div id="wizard" class="max-w-md mx-auto py-2">'
      + '<div class="text-center mb-6">'
      + '<span class="inline-flex items-center gap-2 text-primary-600 dark:text-primary-400 font-bold text-lg">'
      + '<svg viewBox="0 0 100 100" class="w-6 h-6" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="currentColor"/><circle cx="50" cy="50" r="18" fill="white"/></svg>'
      + 'My Fitness</span>'
      + '<h1 class="text-xl font-bold mt-2">' + (w.editing ? 'Edit your plan' : 'Set up your plan') + '</h1>'
      + '</div>'
      + card(stepsBar + '<form id="wizard-form" novalidate>' + errorSummary + body + actions + '</form>')
      + '</div>';
  }

  function readWizardForm() {
    const w = state.wiz;
    const form = document.getElementById('wizard-form');
    if (!form) return;
    const d = w.data;
    ['name', 'age', 'gender', 'email', 'height_cm', 'weight_kg', 'activity_level', 'goal_type', 'target_weight_kg', 'target_date'].forEach((k) => {
      const el = form.querySelector('[name="' + k + '"]');
      if (el) {
        if (el.type === 'radio') {
          const checked = form.querySelector('[name="' + k + '"]:checked');
          if (checked) d[k] = checked.value;
        } else {
          d[k] = el.value;
        }
      }
    });
  }

  function onWizardSubmit(event) {
    event.preventDefault();
    const w = state.wiz;
    readWizardForm();
    if (w.step < 4) {
      const errors = validateStep(w.step, w.data);
      w.errors = errors;
      if (Object.keys(errors).length) { render(); return; }
      w.step += 1;
      w.serverError = null;
      w.errors = {};
      render();
      return;
    }
    // Final step: save. The server revalidates; its values are the truth.
    w.saving = true;
    w.serverError = null;
    w.errors = {};
    render();
    api('/api/profile', { method: 'POST', body: w.data })
      .then((data) => {
        state.onboarded = true;
        state.demo = !!data.demo;
        state.profile = data.profile;
        state.goal = data.goal;
        state.targets = data.targets;
        state.wiz = null;
        state.view = 'dashboard';
        if (location.hash === '#profile') {
          history.replaceState(null, '', location.pathname + location.search + '#dashboard');
        }
        loadDashboard();
      })
      .catch((err) => {
        w.saving = false;
        if (err.status === 400 && err.data && err.data.errors) {
          w.errors = err.data.errors;
          // Jump back to the first step that owns a reported error.
          const owners = { name: 1, age: 1, gender: 1, email: 1, height_cm: 2, weight_kg: 2, activity_level: 2, goal_type: 3, target_weight_kg: 3, target_date: 3 };
          for (const k of Object.keys(err.data.errors)) { w.step = owners[k] || 1; break; }
        } else {
          w.serverError = err.message || 'Could not save your plan';
        }
        render();
      });
  }

  function onWizardInput(event) {
    const target = event.target;
    if (!target || !target.name) return;
    const w = state.wiz;
    if (!w) return;
    if (target.type === 'radio' && target.name === 'goal_type') {
      // Choosing Lose or Gain grows the step to include target fields; a
      // targeted toggle keeps the DOM (and any focus) stable.
      readWizardForm();
      const panel = document.getElementById('goal-target-fields');
      if (panel) {
        const needs = w.data.goal_type === 'lose' || w.data.goal_type === 'gain';
        panel.classList.toggle('hidden', !needs);
      }
      return;
    }
    if (w.errors[target.name]) {
      delete w.errors[target.name];
      const wrap = target.closest('label') || target.closest('div');
      if (wrap) {
        const msg = wrap.querySelector('.text-red-600');
        if (msg) msg.remove();
      }
    }
  }

  // ---------------------------------------------------------------------
  // Dashboard
  // ---------------------------------------------------------------------

  function applyDayPayload(data) {
    state.day = data.date;
    state.profile = data.profile;
    state.goal = data.goal;
    state.targets = data.targets;
    state.meals = data.meals;
    state.water = data.water;
    state.daysToTarget = data.daysToTarget;
    state.demo = !!data.demo || state.demo;
  }

  function loadDashboard() {
    state.dashLoading = true;
    state.dashError = null;
    render();
    api('/api/dashboard')
      .then((data) => {
        applyDayPayload(data);
        state.dashLoading = false;
        render();
      })
      .catch((err) => {
        state.dashLoading = false;
        if (err.status === 409) {
          openWizard(false);
          return;
        }
        state.dashError = err.message || 'Could not load today’s data';
        render();
      });
  }

  function ringSvg(consumed, target) {
    const R = 70;
    const C = 2 * Math.PI * R;
    const frac = target > 0 ? Math.min(consumed / target, 1) : 0;
    const over = target > 0 && consumed > target;
    const strokeClass = over ? 'stroke-accent-500' : 'stroke-primary-500';
    const left = Math.max(0, Math.round(target - consumed));
    return '<div id="calorie-ring" class="relative w-44 h-44 shrink-0" role="img" aria-label="'
      + esc(consumed + ' of ' + target + ' calories consumed') + '">'
      + '<svg viewBox="0 0 180 180" class="w-44 h-44 -rotate-90">'
      + '<circle cx="90" cy="90" r="' + R + '" fill="none" stroke-width="14" class="stroke-zinc-200 dark:stroke-zinc-800"/>'
      + '<circle cx="90" cy="90" r="' + R + '" fill="none" stroke-width="14" stroke-linecap="round" class="' + strokeClass
      + '" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '"/>'
      + '</svg>'
      + '<div class="absolute inset-0 flex flex-col items-center justify-center text-center">'
      + '<span class="text-3xl font-bold tabular-nums">' + left.toLocaleString() + '</span>'
      + '<span class="text-xs text-zinc-500">Calories left</span>'
      + '</div>'
      + '</div>';
  }

  function macroBar(label, consumed, target, barClass) {
    const frac = target > 0 ? Math.min(consumed / target, 1) : 0;
    return '<div>'
      + '<div class="flex justify-between text-xs mb-1"><span class="text-zinc-500">' + esc(label) + '</span>'
      + '<span class="tabular-nums text-zinc-500">' + Math.round(consumed) + ' / ' + Math.round(target) + ' g</span></div>'
      + '<div class="h-2 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden">'
      + '<div class="h-full rounded-full ' + barClass + '" style="width:' + (frac * 100).toFixed(1) + '%"></div>'
      + '</div></div>';
  }

  function calorieCard() {
    const t = state.targets;
    const consumed = state.meals.totals.calories;
    const inner =
      cardTitle('Calories', 'Calorie target ' + t.calorieTarget.toLocaleString() + ' kcal')
      + '<div class="flex flex-col sm:flex-row items-center gap-6">'
      + ringSvg(consumed, t.calorieTarget)
      + '<div class="flex-1 w-full space-y-3">'
      + macroBar('Protein', state.meals.totals.protein_g, t.proteinGrams, 'bg-primary-500')
      + macroBar('Carbs', state.meals.totals.carbs_g, t.carbsGrams, 'bg-accent-400')
      + macroBar('Fat', state.meals.totals.fat_g, t.fatGrams, 'bg-accent-500')
      + '</div></div>';
    return card(inner, 'md:col-span-2');
  }

  function mealEntryRow(e, withRemove) {
    return '<div class="flex items-baseline justify-between gap-3 py-1.5 border-b border-zinc-100 dark:border-zinc-800 last:border-0">'
      + '<span class="text-sm">' + esc(e.name) + '</span>'
      + '<span class="flex items-baseline gap-2 shrink-0">'
      + '<span class="text-sm tabular-nums text-zinc-500">' + Math.round(Number(e.calories)) + ' kcal · P'
      + Math.round(Number(e.protein_g)) + ' C' + Math.round(Number(e.carbs_g)) + ' F' + Math.round(Number(e.fat_g)) + '</span>'
      + (withRemove
        ? '<button data-action="meal-remove" data-id="' + esc(e.id) + '" aria-label="Remove ' + esc(e.name) + '" class="min-h-[44px] min-w-[44px] -my-2 inline-flex items-center justify-center rounded-lg text-zinc-400 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors">×</button>'
        : '')
      + '</span></div>';
  }

  function mealGroupBlock(key, entries, addLabel) {
    return '<div class="mt-3 first:mt-0">'
      + '<div class="flex items-center justify-between gap-2">'
      + '<p class="text-xs font-semibold uppercase tracking-wide text-zinc-500">' + MEAL_LABELS[key] + '</p>'
      + '<button data-action="add-food" data-meal="' + key + '" class="min-h-[36px] px-3 rounded-lg text-sm font-semibold text-primary-700 dark:text-primary-400 hover:bg-primary-600/10 transition-colors">' + addLabel + '</button>'
      + '</div>'
      + (entries.length ? entries.map((e) => mealEntryRow(e, true)).join('')
        : '<p class="text-sm text-zinc-400 py-1">Nothing logged</p>')
      + '</div>';
  }

  function mealsCard() {
    const m = state.meals;
    const inner = '<div class="flex items-baseline justify-between gap-2 mb-4">'
      + '<h2 class="text-sm font-semibold uppercase tracking-wide text-zinc-500">Today’s meals</h2>'
      + '<span class="text-xs text-zinc-500">' + m.count + (m.count === 1 ? ' item' : ' items') + '</span>'
      + '</div>'
      + (m.count === 0
        ? '<div class="py-4 text-center"><p class="text-sm font-medium">No meals logged yet</p>'
          + '<p class="text-sm text-zinc-500 mt-1 mb-3">Log what you eat to track today against your plan.</p>'
          + primaryButton('add-food', 'Add food', 'px-5', 'data-meal="breakfast"') + '</div>'
        : MEAL_ORDER.map((key) => mealGroupBlock(key, m.groups[key] || [], '+ Add')).join(''));
    return card(inner);
  }

  function glassIcon(filled) {
    return '<svg viewBox="0 0 24 24" class="w-6 h-6 ' + (filled ? 'text-primary-500' : 'text-zinc-300 dark:text-zinc-700') + '" fill="currentColor" aria-hidden="true">'
      + '<path d="M6 3h12l-1.2 17a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 3Zm2.6 4 .8 12h6.2l.8-12H8.6Z"/></svg>';
  }

  function waterCard() {
    const w = state.water;
    const targetGlasses = Math.ceil(w.targetMl / w.glassMl);
    const iconCount = Math.min(targetGlasses, 12);
    const pct = Math.min(100, Math.round((w.ml / w.targetMl) * 100));
    const inner =
      cardTitle('Water', 'Target ' + (w.targetMl / 1000).toFixed(1) + ' L')
      + '<div class="flex items-center justify-between gap-3 mb-3">'
      + '<div><p class="text-2xl font-bold tabular-nums">' + w.glasses + ' <span class="text-sm font-medium text-zinc-500">of ' + targetGlasses + ' glasses</span></p>'
      + '<p class="text-sm text-zinc-500 tabular-nums">' + w.ml + ' of ' + w.targetMl + ' ml · ' + pct + '%</p></div>'
      + iconWater.replace('w-5 h-5', 'w-8 h-8 text-primary-500')
      + '</div>'
      + '<div class="flex flex-wrap gap-1.5 mb-4" aria-hidden="true">'
      + Array.from({ length: iconCount }, (_, i) => glassIcon(i < w.glasses)).join('')
      + '</div>'
      + (state.waterError ? '<p class="text-sm text-red-600 dark:text-red-400 mb-2">' + esc(state.waterError) + '</p>' : '')
      + '<div class="flex gap-3">'
      + '<button data-action="water-add" ' + (state.waterPending ? 'disabled' : '') + ' class="flex-1 min-h-[44px] rounded-xl bg-primary-600 hover:bg-primary-500 text-white font-semibold transition-colors disabled:opacity-60">+1 glass</button>'
      + '<button data-action="water-remove" ' + (state.waterPending || w.glasses === 0 ? 'disabled' : '') + ' aria-label="Remove one glass" class="min-h-[44px] min-w-[44px] px-4 rounded-xl border border-zinc-300 dark:border-zinc-700 font-semibold hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors disabled:opacity-40">−1</button>'
      + '</div>';
    return card(inner);
  }

  function statTile(label, value) {
    return '<div class="rounded-xl bg-zinc-100 dark:bg-zinc-800/60 px-4 py-3">'
      + '<p class="text-xs text-zinc-500">' + esc(label) + '</p>'
      + '<p class="text-sm font-semibold mt-0.5">' + value + '</p></div>';
  }

  function planCard() {
    const t = state.targets;
    const p = state.profile;
    const g = state.goal;
    const goalLabel = { lose: 'Lose weight', maintain: 'Maintain weight', gain: 'Gain weight' }[g.goal_type] || g.goal_type;
    const needsTarget = g.goal_type === 'lose' || g.goal_type === 'gain';
    const inner =
      cardTitle('Your plan')
      + '<div class="grid grid-cols-2 sm:grid-cols-3 gap-2">'
      + statTile('Current weight', Number(p.weight_kg).toFixed(1) + ' kg')
      + statTile('Goal', esc(goalLabel))
      + (needsTarget ? statTile('Target weight', Number(g.target_weight_kg).toFixed(1) + ' kg') : '')
      + (needsTarget && g.target_date
        ? statTile('Target date', esc(g.target_date) + (state.daysToTarget != null ? ' · ' + state.daysToTarget + ' days left' : ''))
        : '')
      + statTile('BMI', t.bmi + ' · ' + t.bmiCategory)
      + statTile('BMR', t.bmr.toLocaleString() + ' kcal')
      + statTile('Daily burn (TDEE)', t.tdee.toLocaleString() + ' kcal')
      + '</div>';
    return card(inner, 'md:col-span-2');
  }

  function demoBadge() {
    return state.demo ? '<span class="rounded-full bg-accent-500/15 text-accent-600 dark:text-accent-400 text-xs font-semibold px-3 py-1">Staging demo data</span>' : '';
  }

  function dashboardHtml() {
    const p = state.profile;
    const hour = new Date().getHours();
    const part = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
    const dateLabel = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });

    let body;
    const mealErrorBanner = state.mealError
      ? '<div class="md:col-span-2">' + errorBox(state.mealError, 'Dismiss') + '</div>' : '';
    if (state.dashError) {
      body = '<div class="md:col-span-2">' + errorBox(state.dashError, 'Try again') + '</div>';
    } else if (!state.meals) {
      // First load: skeleton cards while today's data is in flight.
      body =
        card('<div class="animate-pulse space-y-4"><div class="h-44 w-44 rounded-full bg-zinc-200 dark:bg-zinc-800 mx-auto"></div><div class="h-3 rounded bg-zinc-200 dark:bg-zinc-800"></div><div class="h-3 rounded bg-zinc-200 dark:bg-zinc-800 w-2/3"></div></div>', 'md:col-span-2')
        + card('<div class="animate-pulse h-24 rounded-xl bg-zinc-200 dark:bg-zinc-800"></div>')
        + card('<div class="animate-pulse h-24 rounded-xl bg-zinc-200 dark:bg-zinc-800"></div>');
    } else {
      body = calorieCard() + mealsCard() + waterCard() + planCard();
    }

    return '<div class="grid gap-4 md:grid-cols-2">'
      + '<div class="md:col-span-2 flex flex-wrap items-center justify-between gap-2">'
      + '<div><h1 class="text-xl font-bold">' + part + ', ' + esc(p.name.split(' ')[0]) + '</h1>'
      + '<p class="text-sm text-zinc-500">' + esc(dateLabel) + '</p></div>'
      + demoBadge()
      + '</div>'
      + mealErrorBanner
      + body
      + '</div>';
  }

  // ---------------------------------------------------------------------
  // Food log view
  // ---------------------------------------------------------------------

  function enterLog() {
    state.view = 'log';
    const tab = logTabFromHash();
    if (tab !== state.log.tab) { state.log.tab = tab; state.log.error = null; }
    if (state.log.tab === 'today' && !state.meals) {
      loadDayForLog();
      return;
    }
    if (state.log.tab !== 'today' && (state.log.histRange !== state.log.tab || !state.log.hist)) {
      loadHistory(state.log.tab);
      return;
    }
    render();
  }

  function loadDayForLog() {
    state.log.loading = true;
    state.log.error = null;
    render();
    api('/api/history?range=day')
      .then((data) => {
        applyDayPayload(data);
        state.log.loading = false;
        render();
      })
      .catch((err) => {
        state.log.loading = false;
        state.log.error = err.message || 'Could not load today’s food log';
        render();
      });
  }

  function loadHistory(range) {
    state.log.loading = true;
    state.log.error = null;
    render();
    api('/api/history?range=' + range)
      .then((data) => {
        state.log.hist = data;
        state.log.histRange = range;
        state.log.loading = false;
        render();
      })
      .catch((err) => {
        state.log.loading = false;
        state.log.error = err.message || 'Could not load your history';
        render();
      });
  }

  function logTabsHtml() {
    const tabs = [['today', 'Today'], ['week', 'Week'], ['month', 'Month']];
    return '<div class="flex gap-1 border-b border-zinc-200 dark:border-zinc-800 mb-4">'
      + tabs.map((t) =>
        '<button data-action="log-tab" data-tab="' + t[0] + '" aria-current="' + (state.log.tab === t[0] ? 'page' : 'false')
        + '" class="min-h-[44px] px-4 -mb-px text-sm font-semibold border-b-2 transition-colors '
        + (state.log.tab === t[0]
          ? 'border-primary-600 text-primary-700 dark:text-primary-400'
          : 'border-transparent text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100')
        + '">' + t[1] + '</button>').join('')
      + '</div>';
  }

  function logTodayHtml() {
    const t = state.targets;
    const mealErrorBanner = state.mealError ? '<div class="mb-4">' + errorBox(state.mealError, 'Dismiss') + '</div>' : '';
    const totals = state.meals.totals;
    const target = t.calorieTarget;
    const over = totals.calories > target;
    const summary = '<div class="flex flex-wrap gap-4">'
      + '<div><p class="text-xs text-zinc-500">Calories</p>'
      + '<p class="text-2xl font-bold tabular-nums ' + (over ? 'text-accent-600 dark:text-accent-400' : '') + '">' + Math.round(totals.calories).toLocaleString()
      + ' <span class="text-sm font-medium text-zinc-500">of ' + target.toLocaleString() + '</span></p></div>'
      + '<div class="text-xs text-zinc-500 self-end"><p>Protein ' + Math.round(totals.protein_g) + ' g</p>'
      + '<p>Carbs ' + Math.round(totals.carbs_g) + ' g</p><p>Fat ' + Math.round(totals.fat_g) + ' g</p></div>'
      + '</div>';

    return mealErrorBanner
      + card(summary + '<div id="log-meals" class="mt-3">'
        + MEAL_ORDER.map((key) => mealGroupBlock(key, state.meals.groups[key] || [], '+ Add')).join('')
        + '</div>', 'mb-4')
      + waterCard();
  }

  function historyBar(calories, target) {
    const frac = target > 0 ? Math.min(calories / target, 1) : 0;
    const over = calories > target;
    return '<div class="h-2 rounded-full bg-zinc-200 dark:bg-zinc-800 overflow-hidden mt-1">'
      + '<div class="h-full rounded-full ' + (over ? 'bg-accent-500' : 'bg-primary-500') + '" style="width:' + (frac * 100).toFixed(1) + '%"></div>'
      + '</div>';
  }

  function formatDayLabel(dateStr, index, len) {
    if (index === len - 1) return 'Today';
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function historyHtml() {
    const h = state.log.hist;
    const t = h.target;
    const targetGlasses = Math.ceil(t.water_target_ml / 250);
    const list = h.days.map((day, i) =>
      '<li class="py-3 border-b border-zinc-100 dark:border-zinc-800 last:border-0">'
      + '<div class="flex items-baseline justify-between gap-3">'
      + '<span class="text-sm font-medium">' + esc(formatDayLabel(day.date, i, h.days.length)) + '</span>'
      + '<span class="text-sm tabular-nums text-zinc-500">' + Math.round(day.calories) + ' / ' + t.calorie_target.toLocaleString() + ' kcal</span>'
      + '</div>'
      + historyBar(day.calories, t.calorie_target)
      + '<p class="text-xs text-zinc-500 mt-1">' + day.water_glasses + ' of ' + targetGlasses + ' glasses</p>'
      + '</li>').join('');

    const avg = h.averages;
    const avgOver = avg.calories > t.calorie_target;
    const summary = '<div id="log-history-summary" class="rounded-xl border border-zinc-200 dark:border-zinc-800 p-4 mb-4">'
      + '<div class="grid grid-cols-2 gap-3">'
      + '<div><p class="text-xs text-zinc-500">Average calories</p>'
      + '<p class="text-lg font-bold tabular-nums ' + (avgOver ? 'text-accent-600 dark:text-accent-400' : '') + '">' + Math.round(avg.calories).toLocaleString()
      + ' <span class="text-xs font-medium text-zinc-500">of ' + t.calorie_target.toLocaleString() + '</span></p></div>'
      + '<div><p class="text-xs text-zinc-500">Average water</p>'
      + '<p class="text-lg font-bold tabular-nums">' + avg.water_glasses + ' <span class="text-xs font-medium text-zinc-500">of ' + targetGlasses + ' glasses</span></p></div>'
      + '</div></div>';

    return card(summary + '<ul id="log-history">' + list + '</ul>');
  }

  function logViewHtml() {
    const header = '<div class="flex flex-wrap items-center justify-between gap-2 mb-4">'
      + '<h1 class="text-xl font-bold">Food log</h1>' + demoBadge() + '</div>';

    let body;
    if (state.log.loading) body = skeletonBlock();
    else if (state.log.error) body = errorBox(state.log.error, 'Retry');
    else if (state.log.tab === 'today') body = state.meals ? logTodayHtml() : skeletonBlock();
    else body = state.log.hist ? historyHtml() : skeletonBlock();

    return '<div id="log-view">' + header + logTabsHtml() + body + '</div>';
  }

  // ---------------------------------------------------------------------
  // Add food: search, barcode, detail sheet, custom food form
  // ---------------------------------------------------------------------

  function freshAddState() {
    return {
      meal: 'breakfast',
      origin: '#dashboard',
      q: '',
      results: null,       // null = not searched yet
      sections: { recent: [], favorites: [], custom: [] },
      notices: [],
      loading: false,
      error: null,
      barcode: '',
      barcodeBusy: false,
      barcodeError: null,
      scanBusy: false,
      scanError: null,
    };
  }

  function enterAdd() {
    if (!state.add) state.add = freshAddState();
    state.view = 'add';
    state.detail = null;
    state.create = null;
    render();
    if (!state.add.results && !state.add.loading) runSearch('');
  }

  function runSearch(q) {
    const a = state.add;
    a.q = q;
    a.loading = true;
    a.error = null;
    render();
    api('/api/foods/search?q=' + encodeURIComponent(q))
      .then((data) => {
        a.results = data.results || [];
        a.sections = data.sections || { recent: [], favorites: [], custom: [] };
        a.notices = data.notices || [];
        a.loading = false;
        render();
      })
      .catch((err) => {
        a.loading = false;
        a.error = err.message || 'Food search is unavailable right now. Please try again.';
        render();
      });
  }

  function sourceChip(food) {
    const label = food.custom ? 'My food' : esc(food.source_label);
    const cls = food.custom
      ? 'bg-primary-600/10 text-primary-700 dark:text-primary-400'
      : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-500';
    return '<span class="rounded-full ' + cls + ' text-[11px] font-semibold px-2 py-0.5">' + label + '</span>';
  }

  function foodResultRow(food) {
    return '<li class="flex items-stretch gap-2 border-b border-zinc-100 dark:border-zinc-800 last:border-0">'
      + '<button data-action="food-open" data-key="' + esc(food.key) + '" class="flex-1 min-h-[64px] text-left py-3">'
      + '<span class="flex items-baseline gap-2 flex-wrap">'
      + '<span class="text-sm font-medium">' + esc(food.name) + '</span>'
      + sourceChip(food)
      + (food.recent ? '<span class="text-[11px] font-semibold text-zinc-400">Recent</span>' : '')
      + '</span>'
      + (food.brand ? '<span class="block text-xs text-zinc-500 mt-0.5">' + esc(food.brand) + '</span>' : '')
      + '<span class="block text-xs text-zinc-500 mt-0.5">' + esc(food.serving_label) + ' · ' + Math.round(food.calories) + ' kcal</span>'
      + '</button>'
      + '<button data-action="fav-toggle" data-key="' + esc(food.key) + '" data-fav="' + (food.favorite ? '1' : '0') + '" data-favid="' + esc(food.favorite_id == null ? '' : food.favorite_id) + '" aria-label="' + (food.favorite ? 'Remove from favorites' : 'Add to favorites') + '" aria-pressed="' + (food.favorite ? 'true' : 'false') + '" class="min-w-[44px] inline-flex items-center justify-center rounded-lg transition-colors '
      + (food.favorite ? 'text-accent-500 hover:bg-accent-500/10' : 'text-zinc-400 hover:text-accent-500 hover:bg-zinc-100 dark:hover:bg-zinc-800')
      + '">' + (food.favorite ? iconStarFilled : iconStar) + '</button>'
      + '</li>';
  }

  function sectionBlock(title, keys, keyOf) {
    const items = keys.map(keyOf).filter(Boolean);
    if (!items.length) return '';
    return '<div class="mb-4">'
      + '<p class="text-xs font-semibold uppercase tracking-wide text-zinc-500 mb-1">' + title + '</p>'
      + '<ul class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 px-4">'
      + items.map(foodResultRow).join('')
      + '</ul></div>';
  }

  function scanSupported() {
    try {
      return typeof window.BarcodeDetector === 'function'
        && window.isSecureContext === true
        && !!(window.usernode && typeof window.usernode.hasCapability === 'function' && window.usernode.hasCapability('camera'));
    } catch (_) { return false; }
  }

  function addSearchBodyHtml() {
    const a = state.add;
    const q = a.q || '';

    let body = '';
    for (const n of a.notices) body += '<div class="mb-3">' + noticeBox(n.message) + '</div>';

    if (a.scanError) body += '<div class="mb-3"><p class="text-sm text-red-600 dark:text-red-400">' + esc(a.scanError) + '</p></div>';
    if (a.barcodeError) body += '<div class="mb-3"><p class="text-sm text-red-600 dark:text-red-400">' + esc(a.barcodeError) + '</p></div>';

    if (a.error) {
      body += errorBox(a.error, 'Retry');
      if (a.results && a.results.length) {
        body += '<p class="text-xs text-zinc-500 mt-3 mb-1">Showing foods you searched before</p>'
          + '<ul class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 px-4">'
          + a.results.map(foodResultRow).join('') + '</ul>';
      }
      return body;
    }
    if (a.loading) return body + skeletonBlock();
    if (!a.results) return body;

    if (!q) {
      const byKey = new Map();
      for (const f of a.results) byKey.set(f.key, f);
      const keyOf = (k) => byKey.get(k);
      const sections = sectionBlock('Favorites', a.sections.favorites || [], keyOf)
        + sectionBlock('Recent', a.sections.recent || [], keyOf)
        + sectionBlock('My foods', a.sections.custom || [], keyOf);
      if (sections) return body + sections;
      if (a.results.length === 0) {
        return body + '<div class="py-6 text-center"><p class="text-sm font-medium">Search for a food</p>'
          + '<p class="text-sm text-zinc-500 mt-1">Type a name to search Open Food Facts and USDA FoodData Central, or create your own food.</p></div>';
      }
      return body + '<ul class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 px-4">'
        + a.results.map(foodResultRow).join('') + '</ul>';
    }

    if (a.results.length === 0) {
      return body + '<div class="py-6 text-center"><p class="text-sm font-medium">No foods found</p>'
        + '<p class="text-sm text-zinc-500 mt-1">Try a different name, or create your own food.</p></div>';
    }
    return body + '<ul id="food-results" class="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900/60 px-4">'
      + a.results.map(foodResultRow).join('') + '</ul>';
  }

  function addViewHtml() {
    const a = state.add;
    const q = a.q || '';

    const header = '<div class="flex items-center gap-2 mb-4">'
      + '<button data-action="add-back" aria-label="Back" class="min-h-[44px] min-w-[44px] inline-flex items-center justify-center rounded-xl border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">' + iconBack + '</button>'

        : '')
      + '<input id="barcode-input" type="text" inputmode="numeric" autocomplete="off" placeholder="Barcode" value="' + esc(a.barcode) + '" class="' + inputClass + ' flex-1">'
      + '<button type="button" data-action="barcode-lookup" ' + (a.barcodeBusy ? 'disabled' : '') + ' class="min-h-[44px] px-4 rounded-xl border border-zinc-300 dark:border-zinc-700 font-semibold hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors disabled:opacity-60">Look up</button>'

    return card(header + searchForm + mealLine + scanRow + createRow + '<div id="add-results">' + addSearchBodyHtml() + '</div>');

  // --- Detail sheet ---------------------------------------------------------

  function openDetail(food) {
    state.detail = { food, servings: 1, meal: state.add ? state.add.meal : 'breakfast' };
    state.detailError = null;
    state.detailSaving = false;
    render();
  }

  function detailNutrition(food, servings) {
    const f = Number(servings) > 0 ? Number(servings) : 1;
    return {
      calories: round1((Number(food.calories) || 0) * f),
      protein_g: round1((Number(food.protein_g) || 0) * f),
      carbs_g: round1((Number(food.carbs_g) || 0) * f),
      fat_g: round1((Number(food.fat_g) || 0) * f),
    };
  }

  function detailSheetHtml() {
    const d = state.detail;
    const food = d.food;
    const n = detailNutrition(food, d.servings);
    return '<div class="fixed inset-0 z-20 flex items-end sm:items-center justify-center">'
      + '<button data-action="detail-close" aria-label="Close" class="absolute inset-0 bg-zinc-900/50"></button>'
      + '<div id="detail-sheet" class="relative w-full sm:max-w-md max-h-[90vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-5">'
      + '<div class="flex items-start justify-between gap-3 mb-1">'
      + '<div><h2 class="text-lg font-bold">' + esc(food.name) + '</h2>'
      + (food.brand ? '<p class="text-sm text-zinc-500">' + esc(food.brand) + '</p>' : '')

      + '<div class="rounded-xl bg-zinc-100 dark:bg-zinc-800/60 py-2"><p class="text-lg font-bold tabular-nums" id="detail-protein">' + Math.round(n.protein_g) + '</p><p class="text-[11px] text-zinc-500">Protein</p></div>'
      + '<div class="rounded-xl bg-zinc-100 dark:bg-zinc-800/60 py-2"><p class="text-lg font-bold tabular-nums" id="detail-carbs">' + Math.round(n.carbs_g) + '</p><p class="text-[11px] text-zinc-500">Carbs</p></div>'

          + '<button data-action="detail-delete" class="flex-1 min-h-[44px] rounded-xl border border-red-300 dark:border-red-900 text-red-700 dark:text-red-300 font-semibold hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors">Delete</button>'

  function updateDetailNumbers() {
    const d = state.detail;
    if (!d) return;
    const n = detailNutrition(d.food, d.servings);
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = String(Math.round(v)); };
    set('detail-kcal', n.calories);
    set('detail-protein', n.protein_g);
    set('detail-carbs', n.carbs_g);
    set('detail-fat', n.fat_g);
  }

  function addToLog() {
    const d = state.detail;
    state.detailSaving = true;
    state.detailError = null;
    render();
    api('/api/meals', { method: 'POST', body: { key: d.food.key, meal_type: d.meal, servings: d.servings } })
      .then(() => {
        state.detailSaving = false;
        state.detail = null;
        state.add = null;
        state.meals = null;
        state.water = null;
        state.log.tab = 'today';
        state.log.hist = null;
        state.log.histRange = null;
        state.logToast = 'Added to ' + MEAL_LABELS[d.meal];
        window.location.hash = '#log';
        // If the hash was already #log, the hashchange handler will not fire.
        if (routeView() === 'log') enterLog();
      })
      .catch((err) => {
        state.detailSaving = false;
        state.detailError = err.message || 'Could not add that food. Please try again.';
        render();
      });

  function deleteCustomFood(id) {
    api('/api/custom-foods/' + id, { method: 'DELETE' })
      .then(() => {
        state.detail = null;
        state.add.results = null;
        render();
        runSearch(state.add ? state.add.q : '');
      })
      .catch((err) => {
        state.detailError = err.message || 'Could not delete that food. Please try again.';
        render();
      });
  }

  // --- Custom food form -----------------------------------------------------

  function openCreateForm(food) {
    const editing = !!(food && food.custom_food_id);
    state.create = {
      id: editing ? food.custom_food_id : null,
      editing,
      saving: false,
      serverError: null,
      errors: {},
      data: {
        name: food ? food.name : '',
        serving_g: food ? food.serving_g : '',
        serving_label: food ? food.serving_label : '',
        calories: food ? food.calories : '',
        protein_g: food ? food.protein_g : '',
        carbs_g: food ? food.carbs_g : '',
        fat_g: food ? food.fat_g : '',
      },
    };
    state.detail = null;
    render();
  }

  function validateCreate(d) {
    const errors = {};
    if (!d.name || !d.name.trim()) errors.name = 'Enter a name';
    else if (d.name.trim().length > 120) errors.name = 'Name must be 120 characters or fewer';
    const sg = Number(d.serving_g);
    if (!Number.isFinite(sg) || sg < 1 || sg > 500) errors.serving_g = 'Enter a serving size between 1 and 500 g';
    for (const [field, label] of [['calories', 'calories'], ['protein_g', 'protein'], ['carbs_g', 'carbs'], ['fat_g', 'fat']]) {
      const n = Number(d[field]);
      if (!Number.isFinite(n) || n < 0 || n > 5000) errors[field] = 'Enter ' + label + ' between 0 and 5000';
    }
    return errors;
  }

  function createFormHtml() {
    const c = state.create;
    const d = c.data;

    const body =
      field('Name', textInput('cf_name', 'type="text" maxlength="120" placeholder="e.g. Grandma’s granola"', d.name), c.errors.name)
      + field('Serving size (g)', textInput('cf_serving_g', 'type="number" inputmode="decimal" min="1" max="500" step="1" placeholder="g"', d.serving_g), c.errors.serving_g)
      + field('Serving label <span class="font-normal text-zinc-500">(optional)</span>', textInput('cf_serving_label', 'type="text" maxlength="60" placeholder="e.g. 1 cup"', d.serving_label), null)
      + '<div class="grid grid-cols-2 gap-3">'
      + field('Calories', textInput('cf_calories', 'type="number" inputmode="decimal" min="0" max="5000" step="1" placeholder="kcal"', d.calories), c.errors.calories)
      + field('Protein (g)', textInput('cf_protein_g', 'type="number" inputmode="decimal" min="0" max="5000" step="0.1" placeholder="g"', d.protein_g), c.errors.protein_g)
      + field('Carbs (g)', textInput('cf_carbs_g', 'type="number" inputmode="decimal" min="0" max="5000" step="0.1" placeholder="g"', d.carbs_g), c.errors.carbs_g)
      + field('Fat (g)', textInput('cf_fat_g', 'type="number" inputmode="decimal" min="0" max="5000" step="0.1" placeholder="g"', d.fat_g), c.errors.fat_g)
      + '</div>';

    const header = '<div class="flex items-center gap-2 mb-4">'
      + '<button data-action="create-back" aria-label="Back" class="min-h-[44px] min-w-[44px] inline-flex items-center justify-center rounded-xl border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors">' + iconBack + '</button>'
      + '<h1 class="text-xl font-bold flex-1">' + (c.editing ? 'Edit food' : 'Create food') + '</h1>'
      + '</div>';

    const actions = '<div class="flex gap-3 mt-2">'
      + '<button type="submit" ' + (c.saving ? 'disabled' : '') + ' class="flex-1 min-h-[44px] rounded-xl bg-primary-600 hover:bg-primary-500 text-white font-semibold shadow-sm transition-colors disabled:opacity-60">'
      + (c.saving ? 'Saving…' : 'Save food') + '</button></div>';

    return card(header + '<form id="create-food-form" novalidate>'
      + (c.serverError ? '<div class="rounded-xl border border-red-300 dark:border-red-900 bg-red-50 dark:bg-red-950/40 p-3 mb-4 text-sm text-red-700 dark:text-red-300">' + esc(c.serverError) + '</div>' : '')
      + body + actions + '</form>');
  }

  function readCreateForm() {
    const c = state.create;
    const form = document.getElementById('create-food-form');
    if (!form) return;
    const map = { name: 'cf_name', serving_g: 'cf_serving_g', serving_label: 'cf_serving_label', calories: 'cf_calories', protein_g: 'cf_protein_g', carbs_g: 'cf_carbs_g', fat_g: 'cf_fat_g' };
    for (const key of Object.keys(map)) {
      const el = form.querySelector('[name="' + map[key] + '"]');
      if (el) c.data[key] = el.value;
    }
  }

  function submitCreateForm(event) {
    event.preventDefault();
    const c = state.create;
    readCreateForm();
    const errors = validateCreate(c.data);
    c.errors = errors;
    if (Object.keys(errors).length) { render(); return; }
    c.saving = true;
    c.serverError = null;
    render();
    const payload = {
      name: c.data.name.trim(),
      serving_g: Number(c.data.serving_g),
      serving_label: c.data.serving_label ? String(c.data.serving_label).trim() : null,
      calories: Number(c.data.calories),
      protein_g: Number(c.data.protein_g),
      carbs_g: Number(c.data.carbs_g),
      fat_g: Number(c.data.fat_g),
    };
    const req = c.editing
      ? api('/api/custom-foods/' + c.id, { method: 'PUT', body: payload })
      : api('/api/custom-foods', { method: 'POST', body: payload });
    req.then(() => {
      state.create = null;
      state.add.results = null;
      render();
      runSearch(state.add ? state.add.q : '');
    }).catch((err) => {
      c.saving = false;
      if (err.status === 400 && err.data && err.data.errors) c.errors = err.data.errors;
      else c.serverError = err.message || 'Could not save your food. Please try again.';
      render();
    });
  }

  // --- Favorites ------------------------------------------------------------

  function toggleFavorite(key, isFav, favId) {
    const req = isFav
      ? api('/api/favorites/' + favId, { method: 'DELETE' })
      : api('/api/favorites', { method: 'POST', body: { key } });
    req.then(() => {
      state.add.results = null;
      state.detail = null;
      render();
      runSearch(state.add ? state.add.q : '');
      // Refresh the log's Today view so a favorite flipped from there stays honest.
      if (state.meals) api('/api/history?range=day').then(applyDayPayload).catch(() => {});
    }).catch((err) => {
      state.add.error = err.message || 'Could not update your favorites. Please try again.';
      render();
    });
  }

  // --- Barcode --------------------------------------------------------------

  function lookupBarcode(codeOverride) {
    const a = state.add;
    const code = (codeOverride != null ? codeOverride : a.barcode || '').trim();
    if (!/^\d{8,14}$/.test(code)) {
      a.barcodeError = 'Enter a valid barcode (8 to 14 digits)';
      render();
      return;
    }
    a.barcodeBusy = true;
    a.barcodeError = null;
    render();
    api('/api/foods/barcode/' + encodeURIComponent(code))
      .then((data) => {
        a.barcodeBusy = false;
        a.barcode = code;
        render();
        openDetail(data.food);
      })
      .catch((err) => {
        a.barcodeBusy = false;
        a.barcodeError = err.status === 404 ? 'No food found for that barcode' : (err.message || 'Barcode lookup failed. Please try again.');
        render();
      });
  }

  async function scanBarcode() {
    const a = state.add;
    a.scanBusy = true;
    a.scanError = null;
    render();
    let stream = null;
    try {
      const perm = await window.usernode.requestPermission('camera');
      if (perm && perm.state !== 'granted') {
        a.scanBusy = false;
        a.scanError = 'Camera access was not granted';
        render();
        return;
      }
      if (perm && perm.active === false) {
        // Granted, and the frame is about to reload to apply the permission.
        // Stop here and let the reload land.
        a.scanBusy = false;
        render();
        return;
      }
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.muted = true;
      video.srcObject = stream;
      await video.play();
      const detector = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
      let found = null;
      for (let i = 0; i < 40 && !found; i += 1) {
        const codes = await detector.detect(video);
        if (codes && codes.length) found = codes[0].rawValue;
        else await new Promise((r) => setTimeout(r, 250));
      }
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
      a.scanBusy = false;
      if (!found) {
        a.scanError = 'No barcode detected. Try again or type the number below.';
        render();
        return;
      }
      a.barcode = String(found);
      lookupBarcode(String(found));
    } catch (err) {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      a.scanBusy = false;
      a.scanError = 'Could not use the camera. Type the barcode below instead.';
      render();
    }
  }

  // ---------------------------------------------------------------------
  // Shell: sidebar on desktop, bottom nav on mobile
  // ---------------------------------------------------------------------

  function navButton(view, label, icon, active) {
    return '<button data-nav="' + view + '" aria-current="' + (active ? 'page' : 'false') + '" class="flex items-center gap-3 min-h-[44px] w-full px-4 rounded-xl text-sm font-semibold transition-colors '
      + (active
        ? 'bg-primary-600/10 text-primary-700 dark:text-primary-400'
        : 'text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800 hover:text-zinc-900 dark:hover:text-zinc-100')
      + '">' + icon + '<span>' + label + '</span></button>';
  }

  function activeNav() {
    if (state.view === 'log' || state.view === 'add') return 'log';
    if (state.view === 'wizard' && state.wiz && state.wiz.editing) return 'profile';
    return 'dashboard';
  }

  function shell(inner) {
    // The nav exists once a plan does; first-run onboarding is a focused
    // full-screen flow with no dashboard to visit yet.
    if (!state.onboarded) {
      return '<div class="min-h-screen"><main class="max-w-3xl mx-auto w-full px-4 pt-6 pb-10">' + inner + '</main></div>';
    }
    const active = activeNav();
    return '<div class="min-h-screen lg:flex">'
      + '<aside class="hidden lg:flex fixed inset-y-0 left-0 w-60 flex-col gap-2 border-r border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900 p-4">'
      + '<div class="flex items-center gap-2 px-2 py-3 text-primary-600 dark:text-primary-400 font-bold text-lg">'
      + '<svg viewBox="0 0 100 100" class="w-6 h-6" aria-hidden="true"><circle cx="50" cy="50" r="45" fill="currentColor"/><circle cx="50" cy="50" r="18" fill="white"/></svg>'
      + 'My Fitness</div>'
      + '<nav aria-label="Main">' + navButton('dashboard', 'Dashboard', iconDashboard, active === 'dashboard')
      + navButton('log', 'Food log', iconLog, active === 'log')
      + navButton('profile', 'Profile', iconProfile, active === 'profile') + '</nav>'
      + (state.targets ? '<div class="mt-auto rounded-xl bg-zinc-100 dark:bg-zinc-800/60 px-4 py-3 text-sm">'
        + '<p class="text-xs text-zinc-500">Calorie target</p>'
        + '<p class="font-semibold tabular-nums">' + state.targets.calorieTarget.toLocaleString() + ' kcal / day</p></div>' : '')
      + '</aside>'
      + '<div class="flex-1 lg:pl-60"><main class="max-w-3xl mx-auto w-full px-4 pt-6 pb-28 lg:pb-10">' + inner + '</main></div>'
      + '<nav aria-label="Main" class="lg:hidden fixed bottom-0 inset-x-0 z-10 border-t border-zinc-200 dark:border-zinc-800 bg-white/95 dark:bg-zinc-900/95 backdrop-blur" style="padding-bottom:var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px))">'
      + '<div class="grid grid-cols-3 max-w-md mx-auto">'
      + navTab('dashboard', 'Dashboard', iconDashboard, active === 'dashboard')
      + navTab('log', 'Food log', iconLog, active === 'log')
      + navTab('profile', 'Profile', iconProfile, active === 'profile')
      + '</div></nav>'
      + '</div>';
  }

  function navTab(view, label, icon, active) {
    return '<button data-nav="' + view + '" aria-current="' + (active ? 'page' : 'false') + '" class="flex flex-col items-center gap-1 py-2.5 text-xs font-semibold ' + (active ? 'text-primary-600 dark:text-primary-400' : 'text-zinc-500') + '">' + icon + label + '</button>';
  }

  // ---------------------------------------------------------------------
  // Render + events
  // ---------------------------------------------------------------------

  function render() {
    if (state.view === 'loading') {
      appEl.innerHTML = '<div class="min-h-screen flex items-center justify-center">'
        + '<svg viewBox="0 0 24 24" class="w-8 h-8 animate-spin text-primary-600" fill="none" stroke="currentColor" stroke-width="2" aria-label="Loading"><path stroke-linecap="round" d="M12 3a9 9 0 1 0 9 9"/></svg></div>';
      return;
    }
    if (state.view === 'signedout') {
      appEl.innerHTML = '<div class="min-h-screen flex items-center justify-center px-4">'
        + '<div class="max-w-sm text-center"><h1 class="text-xl font-bold mb-2">Sign in required</h1>'
        + '<p class="text-sm text-zinc-500">Open My Fitness from Homeroom so we know who you are.</p></div></div>';
      return;
    }
    if (state.view === 'bootError') {
      appEl.innerHTML = '<div class="min-h-screen flex items-center justify-center px-4">'
        + '<div class="max-w-sm text-center w-full">' + errorBox(state.bootError || 'Something went wrong', 'Try again') + '</div></div>';
      return;
    }
    if (state.view === 'wizard') {
      appEl.innerHTML = shell(wizardHtml());
      const form = document.getElementById('wizard-form');
      if (form) {
        form.addEventListener('submit', onWizardSubmit);
        form.addEventListener('input', onWizardInput);
        form.addEventListener('change', onWizardInput);
      }
      return;
    }
    if (state.view === 'log') {
      appEl.innerHTML = shell(logViewHtml());
      return;
    }

    if (state.view === 'add') {
      if (state.create) {
        appEl.innerHTML = shell(createFormHtml());
        const form = document.getElementById('create-food-form');
        if (form) form.addEventListener('submit', submitCreateForm);
        return;
      }
      let html = shell(addViewHtml());
      if (state.detail) {
        html = shell(addViewHtml() + detailSheetHtml());
      }
      appEl.innerHTML = html;
      const form = document.getElementById('food-search-form');
      if (form) form.addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('food-search-input');
        runSearch(input ? input.value : '');
      });
      const bc = document.getElementById('barcode-input');
      if (bc) {
        bc.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); lookupBarcode(); }
        });
      }
      return;
    }

    // dashboard
    appEl.innerHTML = shell(dashboardHtml());
  }

  // Serving input updates the numbers in place (no re-render, so focus and
  // cursor position survive typing).
  appEl.addEventListener('input', (event) => {
    const t = event.target;
    if (t && t.id === 'detail-servings') {
      const v = Number(t.value);
      if (state.detail) state.detail.servings = Number.isFinite(v) && v > 0 ? v : 1;
      updateDetailNumbers();
      return;
    }
    if (t && t.id === 'barcode-input' && state.add) {
      state.add.barcode = t.value;
    }
  });

  appEl.addEventListener('change', (event) => {
    const t = event.target;
    if (t && t.type === 'radio' && t.name === 'detail_meal' && state.detail) {
      state.detail.meal = t.value;
    }
  });

  appEl.addEventListener('click', (event) => {
    const nav = event.target.closest('[data-nav]');
    if (nav) {
      const target = nav.getAttribute('data-nav');
      if (target === 'profile') location.hash = '#profile';
      else if (target === 'log') location.hash = '#log';
      else {
        state.add = null;
        state.detail = null;
        state.create = null;
        location.hash = '#dashboard';
        if (routeView() === 'dashboard' && state.onboarded) { state.view = 'dashboard'; render(); if (!state.meals) loadDashboard(); }
      }
      return;
    }

    const action = event.target.closest('[data-action]');
    if (!action) return;
    const kind = action.getAttribute('data-action');

    if (kind === 'retry') {
      if (state.mealError) { state.mealError = null; render(); return; }
      if (state.view === 'log') { if (state.log.tab === 'today') loadDayForLog(); else loadHistory(state.log.tab); }
      else if (state.view === 'add') runSearch(state.add ? state.add.q : '');
      else if (state.bootError) { delete state.bootError; state.view = 'loading'; render(); boot(); }
      else loadDashboard();
      return;
    }
    if (kind === 'wiz-back') {
      const w = state.wiz;
      if (w && w.step > 1) { w.step -= 1; w.serverError = null; w.errors = {}; render(); }
      else if (w && state.onboarded) { location.hash = '#dashboard'; }
      return;
    }
    if (kind === 'water-add' || kind === 'water-remove') {
      if (state.waterPending) return;
      state.waterPending = true;
      state.waterError = null;
      render();
      api('/api/water', { method: 'POST', body: { delta: kind === 'water-add' ? 1 : -1 } })
        .then((data) => {
          state.water = Object.assign({}, state.water, data);
          state.waterPending = false;
          render();
        })
        .catch((err) => {
          state.waterPending = false;
          state.waterError = err.message || 'Could not save your water log';
          render();
        });
      return;
    }
    if (kind === 'log-tab') {
      const tab = action.getAttribute('data-tab');
      if (state.log.tab === tab) return;
      state.log.error = null;
      const target = tab === 'today' ? '#log' : '#log/' + tab;
      if (location.hash === target) { state.log.tab = tab; enterLog(); }
      else location.hash = target;
      return;
    }
    if (kind === 'add-food') {
      const meal = action.getAttribute('data-meal') || 'breakfast';
      if (!state.add) state.add = freshAddState();
      state.add.meal = meal;
      state.add.origin = state.view === 'log' ? '#log' : '#dashboard';
      state.add.results = null;
      state.add.error = null;
      state.detail = null;
      state.create = null;
      location.hash = '#add';
      if (routeView() === 'add') enterAdd();
      return;
    }
    if (kind === 'add-back') {
      const origin = (state.add && state.add.origin) || '#dashboard';
      state.add = null;
      state.detail = null;
      state.create = null;
      location.hash = origin;
      if (routeView() !== 'add') {
        if (origin === '#log') enterLog(); else { state.view = 'dashboard'; render(); if (!state.meals) loadDashboard(); }
      }
      return;
    }
    if (kind === 'food-open') {
      const key = action.getAttribute('data-key');
      const food = state.add && state.add.results ? state.add.results.find((f) => f.key === key) : null;
      if (food) openDetail(food);
      return;
    }
    if (kind === 'fav-toggle') {
      if (DEMO) { state.add.error = 'Demo data is read-only'; render(); return; }
      const key = action.getAttribute('data-key');
      const isFav = action.getAttribute('data-fav') === '1';
      const favId = action.getAttribute('data-favid');
      toggleFavorite(key, isFav, favId);
      return;
    }
    if (kind === 'detail-close') { state.detail = null; state.detailError = null; render(); return; }
    if (kind === 'detail-add') { addToLog(); return; }
    if (kind === 'detail-edit') { if (state.detail) openCreateForm(state.detail.food); return; }
    if (kind === 'detail-delete') {
      if (state.detail && state.detail.food.custom_food_id) deleteCustomFood(state.detail.food.custom_food_id);
      return;
    }
    if (kind === 'create-food') { openCreateForm(null); return; }
    if (kind === 'create-back') { state.create = null; render(); return; }
    if (kind === 'barcode-lookup') { lookupBarcode(); return; }
    if (kind === 'scan-barcode') { scanBarcode(); return; }
    if (kind === 'meal-remove') {
      const id = action.getAttribute('data-id');
      if (!id) return;
      state.mealError = null;
      render();
      api('/api/meals/' + id, { method: 'DELETE' })
        .then(() => {
          state.meals = null;
          if (state.view === 'log') loadDayForLog(); else loadDashboard();
        })
        .catch((err) => {
          state.mealError = err.message || 'Could not remove that entry. Please try again.';
          render();
        });
      return;
    }
  });

  boot();
  </script>
</body>
</html>
